version: '3.8'

services:
  auth-service:
    build: .
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/auth_user
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootAdmin
    depends_on:
      - mysql
    networks:
      - auth-service-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rootAdmin
    ports:
      - "3307:3306"
    networks:
      - auth-service-network

networks:
  auth-service-network:
    driver: bridge
